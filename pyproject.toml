[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vet2employ_rag"
version = "1.1.0"
description = "Grounded retrieval augmented generation service that powers the Vet2Employ AI Manager through OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. Copyright Phexara Limited." }
authors = [{ name = "Phexara Limited" }]
# Ranges are bounded below by the oldest tested version and above by the next major
# release. Exact, reproducible versions for images live in requirements/constraints.txt.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",           # required by the admin upload endpoint
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.3,<10.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "defusedxml>=0.7,<1.0",              # openpyxl uses it to block XML entity attacks
    "pdfplumber>=0.11,<1.0",
    "python-docx>=1.1,<2.0",
    "pyyaml>=6.0,<7.0",
    "rapidfuzz>=3.9,<4.0",
    "structlog>=24.1",
    "prometheus-client>=0.20,<1.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
v2e = "v2e_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
v2e_rag = ["py.typed"]

[project.urls]
Documentation = "https://github.com/ANTHONY-CHINEDU-ECHEM/VET2EMPLOY-WORK-SIMULATION-RAG-MODEL-#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that need PostgreSQL with pgvector (set V2E_TEST_DATABASE_URL)",
    "knowledge_base: tests that read the real knowledge base files",
]
# Deprecations raised by this package fail the build; third party ones are shown only.
filterwarnings = [
    "default::DeprecationWarning",
    "error::DeprecationWarning:v2e_rag.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "LOG", "PIE", "T20"]
ignore = [
    "E501", "RUF001", "RUF002", "RUF003", "B008",
    "S101",   # assert is used for internal invariants and type narrowing
    "S104",   # binding to 0.0.0.0 is intended inside the container
    "S608",   # SQL is assembled only from fixed fragments; values are always parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20", "S310"]   # operator tools: print output, call operator supplied URLs

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["v2e_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
