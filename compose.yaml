# Local stack: PostgreSQL 16 with pgvector, the API, and an on demand ingestion job.
#
#   docker compose up -d db api
#   docker compose run --rm ingest
#   docker compose run --rm api doctor
#
# For local development only: the database password is fixed and the port is published.
name: vet2employ_rag

x-service-defaults: &service-defaults
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    V2E_VECTOR_BACKEND: pgvector
    V2E_DATABASE_URL: postgresql://v2e:v2e@db:5432/v2e_rag
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: v2e
      POSTGRES_PASSWORD: v2e
      POSTGRES_DB: v2e_rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v2e -d v2e_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *service-defaults
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Writable so POST /v1/admin/documents can add files. Mount read only (":ro") in
      # environments where uploads are disabled and files arrive another way.
      - ./knowledge_base/raw:/app/knowledge_base/raw
      - ./var/reports:/app/var/reports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ingest:
    <<: *service-defaults
    profiles: ["tools"]
    command: ["ingest"]
    volumes:
      - ./knowledge_base/raw:/app/knowledge_base/raw:ro
      - ./var/reports:/app/var/reports

volumes:
  pgdata:
